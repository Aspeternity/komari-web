name: Validate Frontend

on:
  push:
    branches:
      - radix
      - stable
  pull_request:
    branches:
      - radix
      - stable
  workflow_dispatch:

concurrency:
  group: validate-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
